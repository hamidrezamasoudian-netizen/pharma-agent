name: Run Pharma Agent

on:
  schedule:
    # هر روز ساعت ۱۰:۰۰ و ۲۲:۰۰ به وقت تهران = ۰۶:۳۰ و ۱۸:۳۰ UTC
    - cron: '30 6 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'موضوع دلخواه محتوا (اگر خالی باشد موضوع پرطرفدار روز انتخاب می‌شود)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra wget unzip

      - name: Download Vazirmatn Persian font
        run: |
          mkdir -p fonts
          wget -q -O vazir.zip "https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/vazirmatn-v33.003.zip"
          unzip -q vazir.zip -d vazir_tmp
          find vazir_tmp -name "Vazirmatn-Regular.ttf" -exec cp {} fonts/ \;
          find vazir_tmp -name "Vazirmatn-Bold.ttf" -exec cp {} fonts/ \;
          ls -la fonts/

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Pharma Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAM_APPROVAL_CHAT_ID: ${{ secrets.TELEGRAM_APPROVAL_CHAT_ID }}
          ENABLE_YOUTUBE_PUBLISH: "false"
          ENABLE_INSTAGRAM_PUBLISH: "false"
          VISUAL_STYLE: anime
          ANIME_MASTER_PATH: assets/anime_pharmacist_master.jpg
          MANUAL_UPLOAD_MODE: "true"
          CUSTOM_TOPIC: ${{ github.event.inputs.topic }}
        run: python bot.py
      - name: Save topic history state
        if: always()
        run: |
          if [ -f state/topic_history.json ]; then
            git config user.name "pharma-agent-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/topic_history.json
            git diff --staged --quiet || git commit -m "chore: update topic history"
            git push
          fi

